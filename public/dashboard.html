<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title></head><body>
<h2 id="saludo"></h2>
<script>
fetch('/api/me')
  .then(r => {
    if (!r.ok) throw new Error();  // 401 u otro
    return r.json();
  })
  .then(u => document.getElementById('saludo').textContent = `Hola ${u.username}!`)
  .catch(() => location.href = '/');  // vuelve a index.html
</script>

</body></html>
